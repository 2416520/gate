name: VPN Gate Node Check

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check VPN Gate nodes and build site
        run: python vpngate.py
        env:
          CHECK_WORKER: 'https://gate-check.pwldd520-34f.workers.dev/check?sstp=vpn:vpn@'
          CHECK_CONCURRENCY: '16'
          CHECK_TIMEOUT: '90'
          NODES_URL: 'https://2416520.github.io/gate/nodes.txt'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: echo 'Site https://2416520.github.io/gate/'
